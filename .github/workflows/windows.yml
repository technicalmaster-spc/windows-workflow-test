
name: Windows Python Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Windows
        run: |
          Write-Output "Windows runner is working"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

      - name: Check Python
        run: python --version

      - name: Run my Python code
        run: python main.py
